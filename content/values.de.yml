know_us:
  title: Möchten Sie uns besser kennenlernen?
  md: “inSpirits - Dein Partner für außergewöhnliche Events. Unser erfahrenes Team zaubert unvergessliche Momente an deiner mobilen Bar. Mit Leidenschaft und Know-how kreieren wir maßgeschneiderte Konzepte für jeden Anlass.”
  url: /uber-uns/
  label: Erfahren Sie mehr über uns


