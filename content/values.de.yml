quotes:
  title: Kunden&shy;stimmen
  reviews:

  - title: Ursula Hopf
    sub: '[www.owp.de](https://www.owp.de/ "[nofollow]")'
    md: |
      “Seit Jahren begleitet uns InSpirits Bar bei unserem Messeauftritt in München.

      Die Zusammenarbeit ist immer professionell, hilfsbereit und sehr sympathisch.

      Jederzeit uneingeschränkt empfehlenswert.”
    img: /u/quotes/owp.png

  - title: Aleksandar & Thomas
    sub: '[www.chariot-event.de](https://www.chariot-event.de/ "[nofollow]")'
    md: |
      “Es ist immer schön, mit Profis zusammenzuarbeiten und das seid ihr! Neben der

      Qualtät der Getränke überzeugt ihr auch noch mit eurem Wesen und der Art,wie ihr mit unseren Kund:innen und Gästen umgeht.

      Freuen uns auf viele weitere Events mit euch!”
    img: /u/quotes/chariot-event.jpg

  - title: Katrin
    sub: '[www.dawonia.de](https://www.dawonia.de/ "[nofollow]")'
    md: |
      “Wir arbeiten immer wieder mit Inspirits an unserem Sommerfest zusammen.

      Auf unsere Bedürfnisse und Gegebenheiten wird intensiv eingegangen und immer neue Ideen für die Veranstaltungen machen unser Feste noch schöner.”
    img: /u/quotes/dawonia.svg

  - title: Andrea & Julia
    sub: '[www.medel.com](https://www.medel.com/ "[nofollow]")'
    md: |
      “Mit ihren leckeren Kaffees und Smoothies sorgen Timo, Carlos und das Team für einen energiegeladenen Messestand.

      Ihre positive Ausstrahlung steckt an und macht unsere Kunden glücklich.”
    img: /u/quotes/med-el.svg

  - title: Silke
    sub: '[rehblau-events.de](https://rehblau-events.de/ "[nofollow]")'
    md: |
      “Wir schätzen an Euch Eure Zuverlässigkeit, Flexibilität und Freundlichkeit.

      Ihr passt einfach mit Eurer familiären Art sehr zu unserem Team und unseren Vorstellungen von Dienstleistung.”
    img: /u/quotes/rehblau-events.png

  - title: Magdalena
    sub: '[experience-consulting.de](https://experience-consulting.de/ "[nofollow]")'
    md: |
      “Timo und Carlos sind für unsere Events unverzichtbar: mit gutem Cafe und tollen Getränken sprechen sie unsere Besucher*innen an und animieren so zum Mitmachen.”
    img: /u/quotes/experience-consulting.svg

  - title: Rebecca
    md: |
      “Ich hatte eine Cocktailbar für meinen Geburtstag gemietet und war sehr zufrieden.

      Die Holzbar sieht schick aus und macht richtig was her.

      Die Cocktails waren alle sehr gut  und es gab eine große Auswahl.

      Der Kontakt davor war immer zuverlässig und professionell und Timo als Barkeeper super sympathisch!”
    img: https://lh3.googleusercontent.com/a/ACg8ocJdv18YeVLND9ymlmzKY9gOM8W8uvmJ5oyF8cYHDrItUROV2A=s136

  - title: J M.
    md: |
      “Timo ist ein toller Barista.

      Er hat uns auf der IAA mit allen nur denkbaren und leckeren Kaffeearten versorgt.

      Zudem ist er sehr hilfsbereit, immer gut gelaunt und hat einfach Freude an seinem Beruf.

      Jederzeit würde ich ihn wieder buchen.

      Sein Coffeebike ist einmalig.”
    img: https://lh3.googleusercontent.com/a/ACg8ocIOqbqelbjaDzG7a4LNCjDxPk4zfDUR5D7ava0vDJeCIhDqtA=s136

  - title: Daniel G.
    md: |
      “inSpirits Bar hat uns während eines intensiven Mehrtages-Events hervorragend begleitet und versorgt.

      Mit viel Liebe zum Detail, gastfreundlich, proaktiv und angenehm, freundlichst kümmernd.

      Jederzeit wieder und uneingeschränkt zu empfehlen!”
    img: https://lh3.googleusercontent.com/a-/ALV-UjXjXvdmOQJKdwRRz4Q61SNVefkB8aMRgGNvc5mM4MHL7xnvNX4=s136

  - title: Ginger A.
    md: |
      “Super netter Service.

      Qualität top.

      Die Jungs kennen zu 180% ihr Handwerk.

      Zu 100 % Empfehlenswert.

      Danke an Timo und Carlos”
    img: https://lh3.googleusercontent.com/a-/ALV-UjWrvu5XHUvZMqJ3O5X-BFyxOYYkQT1c_0ZojsT-1s_kb2zAJWGP=s136

  - title: Theo K.
    md: |
      “Ein mega Typ der Timo und eine überragende Idee mit der Bar.

      Weiter so Jungs!”
    img: https://lh3.googleusercontent.com/a/ACg8ocLz_0PUjZ3x0t3jVnn7AWte-ptIWi2Ycqno1zy7whGtTfKaqA=s136

  - title: Romina S.
    md: |
      “Bester Kaffee und super leckere Cocktails auf der Fibo! Toller Service!”
    img: https://lh3.googleusercontent.com/a/ACg8ocLkSDjANK4T30tNowAZILROwbBe_Sm3Z_6ci5SoFi6mgvUqNw=s136

  - title: Tobias K.
    md: |
      “👍 super schnelle Terminvereinbarung noch vor Weihnachten für unsere Immobiliengruppe.

      Danke 🙏 …”
    img: https://lh3.googleusercontent.com/a/ACg8ocIHccD-LI9rZ_fKIoHdjMUedZTT_phcAMJ4_Qr4Sqtfm2xzlg=s136

  - title: Dominik B.
    md: |
      “Kompetentes Team rund um das Thema Messen und Events…klare Empfehlung!”
    img: https://lh3.googleusercontent.com/a/ACg8ocLSAWIgiDPqRy3--2q13FN_xDA3x2i14DHVlrAsmOysEX01_g=s136


services:
  title: Unsere Leistungen
  sub: Services
  label: Mehr entdecken
  contact:
    label: Kontakt
    url: /kontakt/
  boxes:

  - img: /u/services/coffee/thumbnail.jpg
    title: Kaffeewagen
    md: Starten Sie Ihr Event mit Kaffeegenuss! Unsere Baristas zaubern einzigartige Kreationen für jeden Anlass. Kaffeehausflair für Ihre Veranstaltung.
    url: /service/kaffeewagen-munchen/

  - img: /u/services/cocktails/thumbnail.jpg
    title: Mobile Bar
    md: Erleben Sie Mixkunst auf höchstem Niveau. Unsere Barkeeper kreieren einzigartige Cocktails mit frischen Zutaten. Perfekt für Ihre Veranstaltung.
    url: /service/mobile-bar-munchen/

  - img: /u/services/smoothies/thumbnail.jpg
    title: Smoothie-Bar
    md: Erfrischung pur! Gesunde Smoothies, Limonaden & Eistee für Ihre Veranstaltung. Der perfekte Begleiter für einen energiegeladenen Tag.
    url: /service/smoothies/

  - img: /u/services/messe/thumbnail.jpg
    title: Messe Catering
    md: Ihr Messeauftritt, unser Erfolg! Profitieren Sie von unserem maßgeschneiderten Messeservice in der Nähe der Messe München.
    url: /service/messe-catering-munchen/

  - img: /u/services/hire-bartender/thumbnail.jpg
    title: Barkeeper mieten
    md: Mobiler Barkeeper mieten für private Feiern & Firmen-Events Buchen mit professionellem Equipment, regionalen Zutaten und Full-Service von InSpirits Bar.
    url: /service/barkeeper-mieten-muenchen/

  - img: /u/services/others/thumbnail.jpg
    title: Alles aus einer Hand
    md: Kaffee, Cocktails, Catering, Technik & mehr. Wir bieten alles für Ihr perfektes Event. Teilen Sie uns Ihre Wünsche mit, wir machen sie wahr.
    url: /service/others/


